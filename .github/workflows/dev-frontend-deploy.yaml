name: erp-fe-next-development

on:
  push:
    tags:
      - '*-frontend-development'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Create Env File
        working-directory: ./frontend
        run: |
          echo "${{ secrets.DEV_ENV_FRONTEND }}" > .env

      - name: Build Application
        working-directory: ./frontend
        run: npm run build -- --mode development

      - name: Compress Dist Folder
        working-directory: ./frontend
        run: tar -czf dist.tar.gz dist

      - name: Upload Build Artifact to Server via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SECRET_KEY }}
          source: 'frontend/dist.tar.gz'
          target: '/var/www/dev-frontend/'
          strip_components: 1

      - name: Deploy to Server via Development SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SECRET_KEY }}
          script: |
            TAG_NAME="${{ github.ref_name }}"
            cd /var/www/dev-frontend
            ./dev-deployment.sh --tag "$TAG_NAME"
