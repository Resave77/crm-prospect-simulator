name: Controlled Development Database Reconciliation

on:
  workflow_dispatch:

jobs:
  reconcile-dev-database:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile VPS development database
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SECRET_KEY }}
          script: |
            set -eu
            set +x

            SERVICE_NAME="dev-backend.service"
            service_unit="$(sudo systemctl cat "$SERVICE_NAME")"
            service_user="$(sudo systemctl show "$SERVICE_NAME" --property=User --value)"
            working_directory="$(sudo systemctl show "$SERVICE_NAME" --property=WorkingDirectory --value)"
            environment_files_raw="$(sudo systemctl show "$SERVICE_NAME" --property=EnvironmentFiles --value)"

            environment_file="$(printf '%s\n' "$service_unit" | awk -F= '/^[[:space:]]*EnvironmentFile=/{gsub(/^[[:space:]-]+|[[:space:]]+$/, "", $2); print $2; exit}')"
            if [ -z "$environment_file" ]; then
              environment_file="$(printf '%s' "$environment_files_raw" | sed -n 's/.*{[[:space:]]*\([^ ;}]*\).*/\1/p')"
            fi

            database_url=""
            if [ -n "$environment_file" ] && sudo test -r "$environment_file"; then
              database_url="$(sudo awk -F= '$1 == "DATABASE_URL" {sub(/^[^=]*=/, ""); print; exit}' "$environment_file")"
            fi
            if [ -z "$database_url" ] && [ -n "$working_directory" ] && sudo test -r "$working_directory/.env"; then
              database_url="$(sudo awk -F= '$1 == "DATABASE_URL" {sub(/^[^=]*=/, ""); print; exit}' "$working_directory/.env")"
            fi
            if [ -z "$database_url" ]; then
              main_pid="$(sudo systemctl show "$SERVICE_NAME" --property=MainPID --value)"
              if [ "${main_pid:-0}" -gt 0 ] && sudo test -r "/proc/$main_pid/environ"; then
                database_url="$(sudo cat "/proc/$main_pid/environ" | tr '\0' '\n' | sed -n 's/^DATABASE_URL=//p' | head -n 1)"
              fi
            fi
            if [ -z "$database_url" ]; then
              echo 'RECONCILIATION_ERROR=DATABASE_URL_NOT_FOUND'
              exit 1
            fi

            for command_name in python3 psql pg_dump; do
              if ! command -v "$command_name" >/dev/null 2>&1; then
                printf 'RECONCILIATION_ERROR=%s_NOT_AVAILABLE\n' "$(printf '%s' "$command_name" | tr '[:lower:]' '[:upper:]')"
                exit 1
              fi
            done

            normalized_database_url="$(DATABASE_URL="$database_url" python3 -c '
            import os
            import re
            import urllib.parse

            raw = os.environ["DATABASE_URL"].strip()
            if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in ("\"", "\x27"):
                raw = raw[1:-1]
            scheme, separator, remainder = raw.partition("://")
            if separator != "://" or scheme not in ("postgres", "postgresql"):
                raise SystemExit(2)
            authority_match = re.fullmatch(r"([^/?#]*)(.*)", remainder, flags=re.DOTALL)
            if authority_match is None:
                raise SystemExit(2)
            authority, suffix = authority_match.groups()
            userinfo, credential_separator, hostinfo = authority.rpartition("@")
            if not credential_separator:
                hostinfo = authority
            parsed_host = urllib.parse.urlsplit("//" + hostinfo)
            if not parsed_host.hostname:
                raise SystemExit(2)
            credentials = ""
            if credential_separator:
                raw_username, password_separator, raw_password = userinfo.partition(":")
                credentials = urllib.parse.quote(urllib.parse.unquote(raw_username), safe="")
                if password_separator:
                    credentials += ":" + urllib.parse.quote(urllib.parse.unquote(raw_password), safe="")
                credentials += "@"
            hostname = parsed_host.hostname
            formatted_host = "[" + hostname + "]" if ":" in hostname else hostname
            normalized_authority = credentials + formatted_host
            if parsed_host.port is not None:
                normalized_authority += ":" + str(parsed_host.port)
            print(scheme + "://" + normalized_authority + suffix)
            ')" || {
              echo 'RECONCILIATION_ERROR=DATABASE_TARGET_PARSE_FAILED'
              exit 1
            }

            db_host="$(DATABASE_URL="$normalized_database_url" python3 -c 'import os, urllib.parse; print(urllib.parse.urlsplit(os.environ["DATABASE_URL"]).hostname or "")')"
            db_port="$(DATABASE_URL="$normalized_database_url" python3 -c 'import os, urllib.parse; u=urllib.parse.urlsplit(os.environ["DATABASE_URL"]); print(u.port or 5432)')"
            db_name="$(DATABASE_URL="$normalized_database_url" python3 -c 'import os, urllib.parse; print(urllib.parse.unquote(urllib.parse.urlsplit(os.environ["DATABASE_URL"]).path.lstrip("/")))')"
            if [ -z "$db_host" ] || [ -z "$db_name" ]; then
              echo 'RECONCILIATION_ERROR=DATABASE_TARGET_PARSE_FAILED'
              exit 1
            fi
            case "$db_host" in
              localhost|127.0.0.1|::1) db_topology="VPS_LOCALHOST" ;;
              *) db_topology="REMOTE" ;;
            esac
            printf 'DB_HOST=%s\n' "$db_host"
            printf 'DB_PORT=%s\n' "$db_port"
            printf 'DB_NAME=%s\n' "$db_name"
            printf 'DB_TOPOLOGY=%s\n' "$db_topology"

            read_value() {
              PGOPTIONS='-c default_transaction_read_only=on' psql "$normalized_database_url" -X -v ON_ERROR_STOP=1 -Atqc "$1"
            }
            assert_equal() {
              check_name="$1"
              actual_value="$2"
              expected_value="$3"
              if [ "$actual_value" != "$expected_value" ]; then
                printf 'PREFLIGHT_%s=FAIL expected=%s actual=%s\n' "$check_name" "$expected_value" "$actual_value"
                exit 1
              fi
              printf 'PREFLIGHT_%s=PASS\n' "$check_name"
            }

            photo_table="$(read_value "SELECT CASE WHEN to_regclass('public.prospect_photo_tags') IS NULL THEN 'ABSENT' ELSE 'EXISTS' END;")"
            photo_name_state="$(read_value "SELECT COALESCE((SELECT CASE WHEN is_nullable='YES' THEN 'EXISTS_NULLABLE' ELSE 'EXISTS_NOT_NULL' END FROM information_schema.columns WHERE table_schema='public' AND table_name='prospect_photo_tags' AND column_name='photo_name'), 'ABSENT');")"
            photo_index_state="$(read_value "SELECT COALESCE((SELECT CASE WHEN is_nullable='YES' THEN 'EXISTS_NULLABLE' ELSE 'EXISTS_NOT_NULL' END FROM information_schema.columns WHERE table_schema='public' AND table_name='prospect_photo_tags' AND column_name='photo_index'), 'ABSENT');")"
            photo_rows_before="$(read_value 'SELECT COUNT(*) FROM public.prospect_photo_tags;')"
            photo_index_nonnull_before="$(read_value 'SELECT COUNT(*) FROM public.prospect_photo_tags WHERE photo_index IS NOT NULL;')"
            photo_index_duplicates_before="$(read_value 'SELECT COUNT(*) FROM (SELECT prospect_id, photo_index FROM public.prospect_photo_tags WHERE photo_index IS NOT NULL GROUP BY prospect_id, photo_index HAVING COUNT(*) > 1) duplicate_groups;')"
            photo_orphans_before="$(read_value 'SELECT COUNT(*) FROM public.prospect_photo_tags pt LEFT JOIN public.prospects p ON p.id=pt.prospect_id WHERE p.id IS NULL;')"
            ai_analyses_before="$(read_value "SELECT CASE WHEN to_regclass('public.prospect_ai_analyses') IS NULL THEN 'ABSENT' ELSE 'EXISTS' END;")"
            ai_chats_before="$(read_value "SELECT CASE WHEN to_regclass('public.prospect_ai_chats') IS NULL THEN 'ABSENT' ELSE 'EXISTS' END;")"
            prospects_table="$(read_value "SELECT CASE WHEN to_regclass('public.prospects') IS NULL THEN 'ABSENT' ELSE 'EXISTS' END;")"
            users_table="$(read_value "SELECT CASE WHEN to_regclass('public.users') IS NULL THEN 'ABSENT' ELSE 'EXISTS' END;")"
            source_prospect_column="$(read_value "SELECT CASE WHEN EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='customer_sites' AND column_name='source_prospect_id') THEN 'EXISTS' ELSE 'ABSENT' END;")"
            source_prospect_orphans="$(read_value 'SELECT COUNT(*) FROM public.customer_sites cs LEFT JOIN public.prospects p ON p.id=cs.source_prospect_id WHERE p.id IS NULL;')"
            source_prospect_duplicates="$(read_value 'SELECT COUNT(*) FROM (SELECT source_prospect_id FROM public.customer_sites GROUP BY source_prospect_id HAVING COUNT(*) > 1) duplicate_groups;')"

            assert_equal PHOTO_TABLE "$photo_table" EXISTS
            assert_equal PHOTO_NAME "$photo_name_state" ABSENT
            assert_equal PHOTO_INDEX "$photo_index_state" EXISTS_NOT_NULL
            assert_equal PHOTO_ROWS "$photo_rows_before" 6
            assert_equal PHOTO_INDEX_NONNULL_ROWS "$photo_index_nonnull_before" 6
            assert_equal PHOTO_INDEX_DUPLICATES "$photo_index_duplicates_before" 0
            assert_equal PHOTO_PROSPECT_ORPHANS "$photo_orphans_before" 0
            assert_equal AI_ANALYSES "$ai_analyses_before" ABSENT
            assert_equal AI_CHATS "$ai_chats_before" ABSENT
            assert_equal PROSPECTS_TABLE "$prospects_table" EXISTS
            assert_equal USERS_TABLE "$users_table" EXISTS
            assert_equal SOURCE_PROSPECT_ID "$source_prospect_column" EXISTS
            assert_equal SOURCE_PROSPECT_ORPHANS "$source_prospect_orphans" 0
            assert_equal SOURCE_PROSPECT_DUPLICATES "$source_prospect_duplicates" 0
            echo 'PREFLIGHT=PASS'

            backup_directory="${working_directory%/}/backups"
            backup_path="$backup_directory/prospect_photo_tags_before_reconciliation_$(date -u +%Y%m%dT%H%M%SZ).dump"
            sudo install -d -m 700 -o "$service_user" "$backup_directory"
            sudo -u "$service_user" env DATABASE_URL="$normalized_database_url" sh -c 'set +x; pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --table=public.prospect_photo_tags --file="$1"' sh "$backup_path"
            if ! sudo test -s "$backup_path"; then
              echo 'RECONCILIATION_ERROR=BACKUP_NOT_CREATED'
              exit 1
            fi
            printf 'BACKUP_CREATED=YES\nBACKUP_PATH=%s\n' "$backup_path"

            psql "$normalized_database_url" -X -v ON_ERROR_STOP=1 <<'SQL'
            BEGIN;

            ALTER TABLE public.prospect_photo_tags
                ADD COLUMN photo_name TEXT;

            ALTER TABLE public.prospect_photo_tags
                ALTER COLUMN photo_index DROP NOT NULL;

            CREATE UNIQUE INDEX
                idx_prospect_photo_tags_prospect_photo_name_unique
                ON public.prospect_photo_tags (prospect_id, photo_name);

            CREATE INDEX IF NOT EXISTS
                idx_prospect_photo_tags_prospect_id
                ON public.prospect_photo_tags (prospect_id);

            CREATE INDEX IF NOT EXISTS
                idx_prospect_photo_tags_prospect_photo_index
                ON public.prospect_photo_tags (prospect_id, photo_index);

            CREATE TABLE public.prospect_ai_analyses (
                prospect_id UUID NOT NULL,
                summary_json JSONB,
                menu_json JSONB,
                status VARCHAR(20) NOT NULL DEFAULT 'PENDING',
                error_code VARCHAR(64) NOT NULL DEFAULT '',
                created_at TIMESTAMPTZ(6) NOT NULL DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMPTZ(6) NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT prospect_ai_analyses_pkey PRIMARY KEY (prospect_id),
                CONSTRAINT prospect_ai_analyses_prospect_id_fkey
                    FOREIGN KEY (prospect_id)
                    REFERENCES public.prospects(id)
                    ON DELETE CASCADE
                    ON UPDATE NO ACTION
            );

            CREATE TABLE public.prospect_ai_chats (
                id UUID NOT NULL,
                prospect_id UUID NOT NULL,
                user_id UUID NOT NULL,
                message TEXT NOT NULL,
                answer TEXT NOT NULL,
                skill VARCHAR(64) NOT NULL,
                insight TEXT,
                why TEXT,
                recommended_action TEXT,
                created_at TIMESTAMPTZ(6) NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT prospect_ai_chats_pkey PRIMARY KEY (id),
                CONSTRAINT prospect_ai_chats_prospect_id_fkey
                    FOREIGN KEY (prospect_id)
                    REFERENCES public.prospects(id)
                    ON DELETE CASCADE
                    ON UPDATE NO ACTION,
                CONSTRAINT prospect_ai_chats_user_id_fkey
                    FOREIGN KEY (user_id)
                    REFERENCES public.users(id)
                    ON DELETE RESTRICT
                    ON UPDATE NO ACTION
            );

            CREATE INDEX
                prospect_ai_chats_prospect_id_created_at_idx
                ON public.prospect_ai_chats (prospect_id, created_at);

            CREATE INDEX
                prospect_ai_chats_user_id_created_at_idx
                ON public.prospect_ai_chats (user_id, created_at);

            COMMIT;
            SQL
            echo 'TRANSACTION_COMMITTED=YES'

            photo_rows_after="$(read_value 'SELECT COUNT(*) FROM public.prospect_photo_tags;')"
            photo_name_after="$(read_value "SELECT CASE WHEN is_nullable='YES' THEN 'EXISTS_NULLABLE' ELSE 'EXISTS_NOT_NULL' END FROM information_schema.columns WHERE table_schema='public' AND table_name='prospect_photo_tags' AND column_name='photo_name';")"
            photo_index_after="$(read_value "SELECT CASE WHEN is_nullable='YES' THEN 'EXISTS_NULLABLE' ELSE 'EXISTS_NOT_NULL' END FROM information_schema.columns WHERE table_schema='public' AND table_name='prospect_photo_tags' AND column_name='photo_index';")"
            photo_name_null_after="$(read_value 'SELECT COUNT(*) FROM public.prospect_photo_tags WHERE photo_name IS NULL;')"
            photo_index_nonnull_after="$(read_value 'SELECT COUNT(*) FROM public.prospect_photo_tags WHERE photo_index IS NOT NULL;')"
            photo_duplicates_after="$(read_value 'SELECT COUNT(*) FROM (SELECT prospect_id, photo_index FROM public.prospect_photo_tags WHERE photo_index IS NOT NULL GROUP BY prospect_id, photo_index HAVING COUNT(*) > 1) duplicate_groups;')"
            ai_analyses_after="$(read_value "SELECT CASE WHEN to_regclass('public.prospect_ai_analyses') IS NULL THEN 'ABSENT' ELSE 'EXISTS' END;")"
            ai_chats_after="$(read_value "SELECT CASE WHEN to_regclass('public.prospect_ai_chats') IS NULL THEN 'ABSENT' ELSE 'EXISTS' END;")"
            photo_fk_after="$(read_value "SELECT COUNT(*) FROM pg_constraint WHERE conrelid='public.prospect_photo_tags'::regclass AND conname='prospect_photo_tags_prospect_id_fkey' AND contype='f';")"
            ai_fk_after="$(read_value "SELECT COUNT(*) FROM pg_constraint WHERE conrelid IN ('public.prospect_ai_analyses'::regclass, 'public.prospect_ai_chats'::regclass) AND conname IN ('prospect_ai_analyses_prospect_id_fkey','prospect_ai_chats_prospect_id_fkey','prospect_ai_chats_user_id_fkey') AND contype='f';")"
            ai_indexes_after="$(read_value "SELECT COUNT(*) FROM pg_indexes WHERE schemaname='public' AND tablename='prospect_ai_chats' AND indexname IN ('prospect_ai_chats_prospect_id_created_at_idx','prospect_ai_chats_user_id_created_at_idx');")"

            assert_equal POST_PHOTO_ROWS "$photo_rows_after" 6
            assert_equal POST_PHOTO_NAME "$photo_name_after" EXISTS_NULLABLE
            assert_equal POST_PHOTO_INDEX "$photo_index_after" EXISTS_NULLABLE
            assert_equal POST_PHOTO_NAME_NULL_ROWS "$photo_name_null_after" 6
            assert_equal POST_PHOTO_INDEX_NONNULL_ROWS "$photo_index_nonnull_after" 6
            assert_equal POST_PHOTO_INDEX_DUPLICATES "$photo_duplicates_after" 0
            assert_equal POST_AI_ANALYSES "$ai_analyses_after" EXISTS
            assert_equal POST_AI_CHATS "$ai_chats_after" EXISTS
            assert_equal POST_PHOTO_FK "$photo_fk_after" 1
            assert_equal POST_AI_FKS "$ai_fk_after" 3
            assert_equal POST_AI_INDEXES "$ai_indexes_after" 2

            echo 'POST_APPLY_VALIDATION=PASS'
            printf 'PHOTO_TAG_ROWS_BEFORE=%s\n' "$photo_rows_before"
            printf 'PHOTO_TAG_ROWS_AFTER=%s\n' "$photo_rows_after"
            printf 'PHOTO_NAME_AFTER=%s\n' "$photo_name_after"
            printf 'PHOTO_INDEX_AFTER=%s\n' "$photo_index_after"
            printf 'PROSPECT_AI_ANALYSES=%s\n' "$ai_analyses_after"
            printf 'PROSPECT_AI_CHATS=%s\n' "$ai_chats_after"
            echo 'EXISTING_SIX_ROWS_PRESERVED=YES'
            echo 'READY_TO_RERUN_DATABASE_AUDIT=YES'
